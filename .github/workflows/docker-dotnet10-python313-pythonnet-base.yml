name: Build .NET 10 Python 3.13 pythonnet base

on:
  push:
    branches:
      - main
    paths:
      - docker-dotnet10-python313-pythonnet-base/**
  pull_request:
    branches:
      - main
    paths:
      - docker-dotnet10-python313-pythonnet-base/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dotnet10-python313-pythonnet-base
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build image for pull request
        if: github.event_name == 'pull_request' || env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
        uses: docker/build-push-action@v6
        with:
          context: ./docker-dotnet10-python313-pythonnet-base
          push: false
          tags: local/${{ env.IMAGE_NAME }}:test

      - name: Build and push image
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: ./docker-dotnet10-python313-pythonnet-base
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:10.0-python3.13-noble
