name: Build example ASP.NET 10 Python 3.14 Splink smoke app

on:
  push:
    branches:
      - main
    paths:
      - examples/aspnet10-python314-splink-smoke/**
      - .github/workflows/example-aspnet10-python314-splink-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - examples/aspnet10-python314-splink-smoke/**
      - .github/workflows/example-aspnet10-python314-splink-smoke.yml
  workflow_run:
    workflows:
      - Build .NET 10 Python 3.14 pythonnet base
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Skip when triggered by a failed base-image build.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dotnet10-python314-splink-smoke-example
      BASE_IMAGE_NAME: dotnet10-python314-pythonnet-base
      BASE_IMAGE_TAG: 10.0-python3.14-noble
      CONTEXT: ./examples/aspnet10-python314-splink-smoke
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Resolve base image
        id: base
        run: |
          owner="${DOCKER_USERNAME:-hquangthinh}"
          echo "image=${owner}/${BASE_IMAGE_NAME}:${BASE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          load: true
          push: false
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: local/${{ env.IMAGE_NAME }}:test

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:8080 local/${IMAGE_NAME}:test
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health
          echo
          curl -s http://localhost:8080/api/python/info
          echo
          status=$(curl -s -o result.json -w '%{http_code}' -X POST http://localhost:8080/api/python/tests/run)
          cat result.json
          echo
          docker logs smoke
          docker rm -f smoke
          if [ "$status" != "200" ]; then
            echo "Smoke tests failed with HTTP $status"
            exit 1
          fi

      - name: Build and push image
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:10.0-python3.14-noble
